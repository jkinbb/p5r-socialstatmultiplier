name: Build

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Сборка RU + EN, тесты и архив
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Установка .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Сборка, тесты и упаковка (build.sh)
        run: bash build.sh

      - name: Загрузка архива как артефакт сборки
        uses: actions/upload-artifact@v4
        with:
          name: P5R.SocialStatMultiplier-archives
          path: dist/*.zip
          if-no-files-found: error

      - name: Публикация релиза (только по тегу вида v1.2.3)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
