name: Build

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Сборка RU + EN, тесты и архивы
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Установка .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Сборка, тесты и упаковка (build.sh)
        run: bash build.sh

      - name: Контрольные суммы архивов
        run: cat dist/md5.txt

      - name: Загрузка архивов как артефакт сборки
        uses: actions/upload-artifact@v4
        with:
          name: P5R.SocialStatMultiplier-archives
          path: |
            dist/*.zip
            dist/md5.txt
          if-no-files-found: error

      # Релиз создаётся по тегу вида v1.1.1.
      # Архивы лежат в dist/ под ПОСТОЯННЫМИ именами (без версии) — это важно:
      # именно эти имена прописаны в ModConfig.json для автообновления мода,
      # поэтому они не должны меняться от релиза к релизу.
      # Текст релиза (release notes) не генерируется автоматически — его
      # вписывает владелец репозитория (см. PUBLISH_CHECKLIST.md).
      - name: Публикация релиза (только по тегу вида v1.1.1)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/md5.txt
          generate_release_notes: false
